<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsistApp | Iniciar Sesión</title>
    <link rel="stylesheet" href="asistapp.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
    <div class="background">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <div class="container">
        <div class="left">
            <h1>AsistApp</h1>
            <p>Sistema Inteligente de Registro de Asistencia mediante Código QR.</p>
            <ul>
                <li><i class="fa-solid fa-check"></i> Registro rápido</li>
                <li><i class="fa-solid fa-check"></i> Reportes automáticos</li>
                <li><i class="fa-solid fa-check"></i> Gestión moderna</li>
            </ul>
        </div>

        <div class="right">
            <div class="card">
                <h2 id="login-title">Bienvenido</h2>
                <p id="login-subtitle">Ingresa tus datos</p>

                <form id="loginForm">
                    <div class="inputBox">
                        <i class="fa-solid fa-envelope icono-izq"></i>
                        <input type="email" id="email" placeholder="Correo electrónico" required />
                    </div>

                    <div class="inputBox">
                        <i class="fas fa-lock icono-izq"></i>
                        <input type="password" id="password" placeholder="Contraseña" required minlength="4" />
                        <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
                    </div>

                    <div class="options" id="login-options">
                        <label>
                            <input type="checkbox" id="recordarme" /> Recordarme
                        </label>
                    </div>

                    <button type="submit" class="login" id="main-btn">Iniciar Sesión</button>

                    <div class="separator"><span>o</span></div>

                    <button type="button" class="register" id="toggle-btn">Crear Cuenta</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./conexion.js";

        // Si ya existe sesión activa, ir directo al menú
        if (localStorage.getItem("sesion")) {
            window.location.href = "menu.html";
        }

        let esLogin = true;
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        const toggleBtn = document.getElementById("toggle-btn");
        const loginForm = document.getElementById("loginForm");

        // Mostrar / ocultar contraseña
        eyeIcon.addEventListener("click", () => {
            const esPassword = passwordInput.type === "password";
            passwordInput.type = esPassword ? "text" : "password";
            eyeIcon.classList.toggle("fa-eye", !esPassword);
            eyeIcon.classList.toggle("fa-eye-slash", esPassword);
        });

        // Cambiar entre Iniciar Sesión y Crear Cuenta
        toggleBtn.addEventListener("click", () => {
            esLogin = !esLogin;
            document.getElementById("login-title").innerText = esLogin ? "Bienvenido" : "Crear Cuenta";
            document.getElementById("login-subtitle").innerText = esLogin ? "Ingresa tus datos" : "Regístrate como docente";
            document.getElementById("main-btn").innerText = esLogin ? "Iniciar Sesión" : "Registrarse";
            toggleBtn.innerText = esLogin ? "Crear Cuenta" : "Ya tengo cuenta, Iniciar Sesión";
            document.getElementById("login-options").style.display = esLogin ? "flex" : "none";
        });

        // Envío del formulario
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;
            const mainBtn = document.getElementById("main-btn");

            mainBtn.disabled = true;

            try {
                if (esLogin) {
                    const { data, error } = await supabase
                        .from("usuarios")
                        .select("id_usuario, correo, rol")
                        .eq("correo", email)
                        .eq("password_hash", password)
                        .maybeSingle();

                    if (error) throw error;

                    if (data) {
                        localStorage.setItem("sesion", JSON.stringify(data));
                        window.location.href = "menu.html";
                    } else {
                        alert("Correo o contraseña incorrectos.");
                    }
                } else {
                    const { data, error } = await supabase
                        .from("usuarios")
                        .insert([{ correo: email, password_hash: password, rol: "Docente" }])
                        .select("id_usuario, correo, rol")
                        .single();

                    if (error) {
                        if (error.code === "23505") {
                            alert("Este correo ya está registrado.");
                        } else {
                            throw error;
                        }
                        return;
                    }

                    localStorage.setItem("sesion", JSON.stringify(data));
                    alert("¡Cuenta creada con éxito!");
                    window.location.href = "menu.html";
                }
            } catch (err) {
                console.error("Error de autenticación:", err);
                alert("Error al conectar con la base de datos.");
            } finally {
                mainBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
